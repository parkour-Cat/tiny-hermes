server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    # No X-Frame-Options, deliberately, unlike apps/web/nginx.conf's "DENY".
    # Design §7: this surface is meant to be embedded in an enterprise's own
    # page, and a framing block here would refuse the one thing this app
    # exists to do. The origin allowlist (channel_issuers.allowed_origins,
    # enforced server-side on every state-changing end-user request) is what
    # stands in for the protection X-Frame-Options would otherwise give up.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
