server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker's embedded DNS. Required because the upstreams below are named
    # through variables: nginx resolves a *literal* host once at startup and
    # keeps that address for the life of the process, so recreating the api
    # container left this proxying to an address nothing answered on — the
    # home page kept loading while every API call returned 502.
    #
    # This address is Docker's, not a universal one. A deployment on another
    # orchestrator has to point it at that platform's resolver.
    #
    # `valid=10s` rather than the record's own TTL: Docker answers with a
    # very short one and nginx would otherwise re-query on nearly every
    # request. `ipv6=off` because the compose network has no AAAA records,
    # and asking for them costs a failed lookup per resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Appending the URI is not optional here. A literal upstream makes
        # nginx forward the request URI on its own; the variable form does
        # not — it sends a bare / and drops the path, which 404s every route
        # while this file still reads as correct.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /health/ {
        set $health_upstream http://api:8000;
        proxy_pass $health_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
