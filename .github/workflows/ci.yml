name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to an exact release, not a floating major: this action
      # publishes major tags only through v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check packages/backend
      - run: uv run pyright
      - run: uv run pytest packages/backend/tests/unit -v

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: tiny_hermes_test
          POSTGRES_USER: tiny_hermes
          POSTGRES_PASSWORD: local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiny_hermes -d tiny_hermes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://tiny_hermes:local-only@localhost:5432/tiny_hermes_test
      TEST_DATABASE_URL: postgresql+asyncpg://tiny_hermes:local-only@localhost:5432/tiny_hermes_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to an exact release, not a floating major: this action
      # publishes major tags only through v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest packages/backend/tests/integration -v
      - name: Repeat concurrency regressions
        run: |
          for attempt in $(seq 1 10); do
            uv run pytest \
              packages/backend/tests/integration/runs/test_run_creation.py \
              packages/backend/tests/integration/runs/test_run_control.py \
              packages/backend/tests/integration/runs/test_run_coordination.py \
              packages/backend/tests/integration/runs/test_run_retry.py \
              packages/backend/tests/integration/runs/test_scheduler.py \
              packages/backend/tests/integration/runs/test_execution_flow.py -q
          done
      - name: Integration suite with the wake-up channel unreachable
        # Redis buys latency, never correctness. Pointing REDIS_URL at a port
        # nothing listens on proves the platform falls back to polling: the
        # tests that assert the optimization itself skip, and every other test
        # must still pass untouched.
        env:
          REDIS_URL: redis://127.0.0.1:6399/0
        run: uv run pytest packages/backend/tests/integration -q
      - run: uv run alembic check
      - run: uv run alembic downgrade 20260811_0005
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260811_0004
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260810_0003
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260810_0002
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260810_0001
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.6.0"
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:test
      - run: pnpm web:build

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.6.0"
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to an exact release, not a floating major: this action
      # publishes major tags only through v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f deploy/compose/compose.yaml up -d --build --wait
      - run: pnpm exec playwright test --config tests/e2e/playwright.config.ts
      # The drill restarts processes in the middle of a Run, so a Run has to be
      # long enough to be interrupted. The stack is recreated with a slower
      # deterministic model rather than run that way throughout, which would
      # only make the console walk above wait for nothing. Recreating keeps the
      # volumes, so the account the Playwright setup bootstrapped is still there.
      - name: Restart drill
        env:
          DETERMINISTIC_MODEL_DELAY_MS: "3000"
        run: |
          docker compose -f deploy/compose/compose.yaml up -d --wait
          uv run python scripts/restart_drill.py
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
