name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to an exact release, not a floating major: this action
      # publishes major tags only through v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check packages/backend
      - run: uv run pyright
      - run: uv run pytest packages/backend/tests/unit -v

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: tiny_hermes_test
          POSTGRES_USER: tiny_hermes
          POSTGRES_PASSWORD: local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiny_hermes -d tiny_hermes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://tiny_hermes:local-only@localhost:5432/tiny_hermes_test
      TEST_DATABASE_URL: postgresql+asyncpg://tiny_hermes:local-only@localhost:5432/tiny_hermes_test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: tiny-hermes-test
      S3_ACCESS_KEY: tiny-hermes-local
      S3_SECRET_KEY: tiny-hermes-local-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to an exact release, not a floating major: this action
      # publishes major tags only through v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      # The sandbox suite builds and runs real containers. Build once as an
      # explicit CI boundary check so an unavailable daemon or broken runtime
      # image is reported as such; the fixture's second build is cache-backed.
      - name: Build the sandbox runtime image
        run: docker build -t tiny-hermes-sandbox:test -f deploy/sandbox/Dockerfile deploy/sandbox
      # A plain step rather than a service container: the minio image needs
      # its `server /data` arguments, and GitHub services cannot pass any.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tiny-hermes-local \
            -e MINIO_ROOT_PASSWORD=tiny-hermes-local-password \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - run: uv run alembic upgrade head
      - run: uv run pytest packages/backend/tests/integration -v
      - name: Repeat concurrency regressions
        run: |
          for attempt in $(seq 1 10); do
            uv run pytest \
              packages/backend/tests/integration/runs/test_run_creation.py \
              packages/backend/tests/integration/runs/test_run_control.py \
              packages/backend/tests/integration/runs/test_run_coordination.py \
              packages/backend/tests/integration/runs/test_run_retry.py \
              packages/backend/tests/integration/runs/test_scheduler.py \
              packages/backend/tests/integration/runs/test_execution_flow.py \
              packages/backend/tests/integration/session_workspace/test_checkpoint_commit.py -q
          done
      - name: Integration suite with the wake-up channel unreachable
        # Redis buys latency, never correctness. Pointing REDIS_URL at a port
        # nothing listens on proves the platform falls back to polling: the
        # tests that assert the optimization itself skip, and every other test
        # must still pass untouched.
        env:
          REDIS_URL: redis://127.0.0.1:6399/0
        run: uv run pytest packages/backend/tests/integration -q
      - run: uv run alembic check
      - run: uv run alembic downgrade 20260811_0007
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260811_0006
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260811_0005
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260811_0004
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260810_0003
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260810_0002
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 20260810_0001
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.6.0"
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:test
      - run: pnpm web:build

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.6.0"
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to an exact release, not a floating major: this action
      # publishes major tags only through v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build the sandbox runtime image
        id: sandbox
        run: |
          docker build -t tiny-hermes-sandbox:ci -f deploy/sandbox/Dockerfile deploy/sandbox
          echo "digest=$(docker image inspect tiny-hermes-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - env:
          SANDBOX_IMAGE_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: docker compose -f deploy/compose/compose.yaml up -d --build --wait
      # This is socket sharing, not a privileged Docker daemon nested inside
      # another container. Only the small Controller gets the runner's daemon
      # socket; the request-facing API and the Worker must not even see it.
      - name: Prove the Docker socket boundary in the running stack
        run: |
          docker compose -f deploy/compose/compose.yaml exec -T controller sh -c 'test -S /var/run/docker.sock'
          docker compose -f deploy/compose/compose.yaml exec -T api sh -c 'test ! -e /var/run/docker.sock'
          docker compose -f deploy/compose/compose.yaml exec -T worker sh -c 'test ! -e /var/run/docker.sock'
      # The other half of design §14.6: the one process holding Docker holds
      # no MinIO credential and no model key, and the processes holding those
      # never see the socket.
      - name: Prove the credential boundary in the running stack
        run: |
          docker compose -f deploy/compose/compose.yaml exec -T controller sh -c 'test -z "$S3_ACCESS_KEY" && test -z "$S3_SECRET_KEY"'
          docker compose -f deploy/compose/compose.yaml exec -T controller sh -c 'test -z "$TINY_HERMES_MODEL_KEY_EXAMPLE"'
          docker compose -f deploy/compose/compose.yaml exec -T worker sh -c 'test -n "$S3_ACCESS_KEY"'
      - run: pnpm exec playwright test --config tests/e2e/playwright.config.ts
      # The drill restarts processes in the middle of a Run, so a Run has to be
      # long enough to be interrupted. The stack is recreated with a slower
      # deterministic model rather than run that way throughout, which would
      # only make the console walk above wait for nothing. Recreating keeps the
      # volumes, so the account the Playwright setup bootstrapped is still there.
      - name: Restart drill
        env:
          DETERMINISTIC_MODEL_DELAY_MS: "3000"
          SANDBOX_IMAGE_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          docker compose -f deploy/compose/compose.yaml up -d --wait
          uv run --no-sync python scripts/restart_drill.py
      # A container this run created and did not clean up is a finding, not
      # housekeeping: the fourth drill scenario exists to make it impossible.
      - name: No sandbox container outlived the run
        if: always()
        run: |
          left=$(docker ps -aq --filter "label=tiny-hermes.run" | wc -l)
          echo "sandbox containers left behind: $left"
          test "$left" -eq 0
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
