[project]
name = "tiny-hermes"
version = "0.0.0"
description = "A multi-tenant runtime for lightweight Hermes-style agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    # A runtime dependency since phase 3A: `tiny_hermes.outbound` is the one
    # place allowed to build an HTTP client, and it is production code.
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
tiny-hermes-api = "tiny_hermes.api.cli:main"
tiny-hermes-worker = "tiny_hermes.api.cli:worker_main"
tiny-hermes-scheduler = "tiny_hermes.api.cli:scheduler_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/backend/src/tiny_hermes"]

[tool.pytest.ini_options]
testpaths = ["packages/backend/tests"]
addopts = "-ra"
pythonpath = ["packages/backend/src"]
asyncio_mode = "auto"
markers = ["settings: override Settings fields for the live server fixture"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TID251 only, not the whole TID family: TID252's opinion about relative imports
# is a style question this slice has no business reopening.
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "TID251"]

# Everything that leaves this process goes through tiny_hermes.outbound, which
# resolves, vets, and pins every address and re-checks every redirect hop. A
# second client built anywhere else would bypass all of it, so the rule is
# machine-checked rather than left to review.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx.AsyncClient".msg = "Outbound requests go through tiny_hermes.outbound.client."
"httpx.Client".msg = "Outbound requests go through tiny_hermes.outbound.client."
"httpx.AsyncHTTPTransport".msg = "Outbound requests go through tiny_hermes.outbound.client."
"httpx.HTTPTransport".msg = "Outbound requests go through tiny_hermes.outbound.client."
"socket.socket".msg = "Outbound requests go through tiny_hermes.outbound.client."
"socket.create_connection".msg = "Outbound requests go through tiny_hermes.outbound.client."
"urllib.request.urlopen".msg = "Outbound requests go through tiny_hermes.outbound.client."

[tool.ruff.lint.per-file-ignores]
# The guarded path itself.
"packages/backend/src/tiny_hermes/outbound/**/*.py" = ["TID251"]
# Tests and the restart drill are clients of this platform rather than parts of
# it, and neither ships.
"packages/backend/tests/**/*.py" = ["S101", "S104", "S106", "TID251"]
"scripts/**/*.py" = ["TID251"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages/backend/src", "packages/backend/tests", "scripts"]
extraPaths = ["packages/backend/src", "packages/backend/tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
