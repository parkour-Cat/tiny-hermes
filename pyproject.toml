[project]
name = "tiny-hermes"
version = "0.0.0"
description = "轻量 Hermes 内核预览"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "docker>=7.2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    # A runtime dependency since phase 3A: `tiny_hermes.outbound` is the one
    # place allowed to build an HTTP client, and it is production code.
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    # End-user credential verification only (identity/domain/end_user_credential.py).
    # The algorithm allow-list is enforced at every call site, never left to
    # this library's defaults — see that module for why.
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
tiny-hermes-api = "tiny_hermes.api.cli:main"
tiny-hermes-worker = "tiny_hermes.api.cli:worker_main"
tiny-hermes-scheduler = "tiny_hermes.api.cli:scheduler_main"
tiny-hermes-controller = "tiny_hermes.sandbox.cli:main"
tiny-hermes-egress = "tiny_hermes.egress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/backend/src/tiny_hermes"]

[tool.pytest.ini_options]
testpaths = ["packages/backend/tests"]
addopts = "-ra"
pythonpath = ["packages/backend/src"]
asyncio_mode = "auto"
markers = ["settings: override Settings fields for the live server fixture"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TID251 only, not the whole TID family: TID252's opinion about relative imports
# is a style question this slice has no business reopening.
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "TID251"]

# Everything that leaves this process goes through tiny_hermes.outbound, which
# resolves, vets, and pins every address and re-checks every redirect hop. A
# second client built anywhere else would bypass all of it, so the rule is
# machine-checked rather than left to review.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx.AsyncClient".msg = "Outbound requests go through tiny_hermes.outbound.client."
"httpx.Client".msg = "Outbound requests go through tiny_hermes.outbound.client."
"httpx.AsyncHTTPTransport".msg = "Outbound requests go through tiny_hermes.outbound.client."
"httpx.HTTPTransport".msg = "Outbound requests go through tiny_hermes.outbound.client."
"socket.socket".msg = "Outbound requests go through tiny_hermes.outbound.client."
"socket.create_connection".msg = "Outbound requests go through tiny_hermes.outbound.client."
"urllib.request.urlopen".msg = "Outbound requests go through tiny_hermes.outbound.client."
# Product design §16: 沙箱失败时不得回退宿主机执行. Nothing in this platform
# starts a process on the host — a tool runs in a container or it does not run.
"subprocess.run".msg = "Commands run in a sandbox container, never on this host."
"subprocess.Popen".msg = "Commands run in a sandbox container, never on this host."
"subprocess.call".msg = "Commands run in a sandbox container, never on this host."
# Design §14.3: trusted-process code never extracts archives locally. The
# daemon extracts inside containers; this process only streams and hashes.
"tarfile.TarFile.extractall".msg = "No local archive extraction; scan the stream instead."
"tarfile.TarFile.extract".msg = "No local archive extraction; scan the stream instead."
"shutil.unpack_archive".msg = "No local archive extraction; scan the stream instead."
"subprocess.check_call".msg = "Commands run in a sandbox container, never on this host."
"subprocess.check_output".msg = "Commands run in a sandbox container, never on this host."
"os.system".msg = "Commands run in a sandbox container, never on this host."
"os.popen".msg = "Commands run in a sandbox container, never on this host."
"asyncio.create_subprocess_exec".msg = "Commands run in a sandbox container, never on this host."
"asyncio.create_subprocess_shell".msg = "Commands run in a sandbox container, never on this host."
# Exactly one module holds the handle to the daemon.
"docker.from_env".msg = "Only tiny_hermes.sandbox.infrastructure talks to Docker."
"docker.DockerClient".msg = "Only tiny_hermes.sandbox.infrastructure talks to Docker."

[tool.ruff.lint.per-file-ignores]
# The two guarded paths themselves. TID251 is a single code, so exempting a
# module lifts both bans there; `test_process_ban.py` asserts that neither
# module uses the other's licence.
"packages/backend/src/tiny_hermes/outbound/**/*.py" = ["TID251"]
"packages/backend/src/tiny_hermes/sandbox/infrastructure/**/*.py" = ["TID251"]
# Tests and the restart drill are clients of this platform rather than parts of
# it, and neither ships.
"packages/backend/tests/**/*.py" = ["S101", "S104", "S106", "TID251"]
"scripts/**/*.py" = ["TID251"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Checked against the platform this is deployed on, not the one it is written
# on. `asyncio.open_unix_connection` and friends do not exist in Python on
# Windows, so checking as Windows would report the Controller's transport as
# undefined while it is the only supported target. The tests that genuinely
# branch on the host platform do so at runtime.
pythonPlatform = "Linux"
include = ["packages/backend/src", "packages/backend/tests", "scripts"]
extraPaths = ["packages/backend/src", "packages/backend/tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
]
