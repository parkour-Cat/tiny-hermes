# 只为这一台开发机存在，不要提交。
#
# 本机的代理开着 fake-IP 模式：每个域名都解析成 198.18.0.0/15（RFC 2544 的
# 基准测试保留段）然后由它自己接管流量。容器通过 Docker 内嵌解析器继承了
# 宿主机这套 DNS，于是 egress-proxy 解析 open.feishu.cn 得到 198.18.0.35,
# 判定为私有地址并拒绝——SSRF 防护做的是对的，是 DNS 在撒谎。
#
# 给这几个真正发出站请求的服务指定真实解析器。已验证容器能直连解析出来的
# 真 IP（120.233.177.2:443 OK），所以绕过假 IP 就够，不需要放宽任何白名单。
#
# 2026-09-03 追加 `use-vc`：本机代理后来把容器发出的 UDP 53 也吃掉了，于是上面
# 那两个解析器一个字节都回不来（容器里 `nslookup` 全是 timed out），长连接从
# 2026-09-02 23:53 起一整晚没连上。同一时刻容器到 223.5.5.5 的 **TCP** 53 是通
# 的，`use-vc` 让 glibc 走 TCP 问，Docker 内嵌解析器也就按 TCP 转发上去——实测
# 拿到的是真 IP（120.233.206.129），不是 198.18.x 那个假的。
#
# 换句话说这一条钉的是「UDP 被吃掉」，不是「解析器写错了」。哪天代理关了、
# UDP 通了，去掉它也照样能跑，只是会慢一点点。
services:
  egress-proxy:
    dns: [223.5.5.5, 119.29.29.29]
    dns_opt: [use-vc]
  worker:
    dns: [223.5.5.5, 119.29.29.29]
    dns_opt: [use-vc]
  scheduler:
    dns: [223.5.5.5, 119.29.29.29]
    dns_opt: [use-vc]
  api:
    dns: [223.5.5.5, 119.29.29.29]
    dns_opt: [use-vc]
