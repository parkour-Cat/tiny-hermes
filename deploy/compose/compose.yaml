name: tiny-hermes

# Two environment shapes on purpose. The base carries no credential of any
# kind; the app shape adds the object-store keys and the model-key passthrough. The
# controller keeps only the base: it holds the Docker socket, and a process
# holding Docker must not also hold object-storage credentials or model keys —
# design §14.6 makes both directions of that separation an assertion.
x-base-env: &base-env
  # `development` keeps the shipped defaults below usable on a laptop. Any
  # other value marks session cookies Secure and refuses to start on those
  # defaults, so a real deployment sets it and finds out what it forgot.
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://tiny_hermes:${POSTGRES_PASSWORD:-local-only}@postgres:5432/tiny_hermes
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://seaweedfs:9000
  S3_BUCKET: tiny-hermes
  SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-local-cookie-secret-with-32-characters}
  BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-local-bootstrap-token-with-32-characters}
  # How long the deterministic model pretends to think. The default keeps a
  # Run short enough to watch; the restart drill raises it, because a Run
  # that finishes in a blink cannot have a restart land inside it.
  DETERMINISTIC_MODEL_DELAY_MS: ${DETERMINISTIC_MODEL_DELAY_MS:-50}
  # How long a Worker's claim on a Run survives without renewal. Not a §24.1
  # number, but §24.1's 30s recovery cell and the workspace drill's 100 MiB
  # checkpoint disagree about it, so a drill has to be able to vary it
  # without editing the source. See 2026-08-15-m1-drills-16gb.md.
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-20}
  # Workers per worker container (1–64). Each concurrent Run can hold a sandbox
  # on this one Docker host, so raising it is a capacity decision.
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  # Product design §1.21.2-3 (v2.21): Runs one user or end user may have
  # executing at once where their workspace sets no limit, and how long a
  # background Run waits before it is claimed as if interactive.
  RUN_LIMIT_PER_CALLER: ${RUN_LIMIT_PER_CALLER:-3}
  RUN_INTERACTIVE_PROMOTION_SECONDS: ${RUN_INTERACTIVE_PROMOTION_SECONDS:-120}
  # The metrics port's bearer token (observability design §4.2). Empty serves
  # every process's metrics without one, except the egress proxy's: a sandbox
  # can reach every port the proxy listens on, so it serves none without a
  # token. .env.example says how to generate one.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # Tracing (observability design §5.1). Empty traces nothing; with the
  # observability profile, set http://jaeger:4318. The share of Runs traced
  # is decided when each is created; 1.0 locally, about 0.1 in production.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  # How long a stopping Worker may take to finish the round under way and hand
  # its Runs back (5–120 s). Past it, they wait for their leases to lapse. The
  # worker's `stop_grace_period` below must be longer, or Compose kills first.
  WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-20}
  # How long a Worker keeps a Run before it goes back to the queue (10–300 s).
  # Shorter slices bound how long a newly queued Run waits behind long tasks
  # (§21.3); each slice boundary freezes and later thaws a sandbox.
  WORKER_MAX_SLICE_SECONDS: ${WORKER_MAX_SLICE_SECONDS:-30}
  # The most model and tool calls an Agent may ask for per Run (§12.3). A long
  # task makes one model call per round, so this is its round ceiling.
  AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-20}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-200}
  # §1.21.1 (v2.21): the execution time an Agent may ask for where its
  # workspace sets nothing, and how far a workspace administrator may raise
  # that and the model calls above (设置 → 运行上限).
  AGENT_MAX_EXECUTION_SECONDS: ${AGENT_MAX_EXECUTION_SECONDS:-900}
  AGENT_CEILING_EXECUTION_SECONDS: ${AGENT_CEILING_EXECUTION_SECONDS:-7200}
  AGENT_CEILING_MODEL_CALLS: ${AGENT_CEILING_MODEL_CALLS:-200}
  # Outbound safety. The default approves nothing, so only public addresses
  # are reachable; an enterprise private endpoint needs its range named here.
  OUTBOUND_ALLOWED_CIDRS: ${OUTBOUND_ALLOWED_CIDRS:-}
  OUTBOUND_READ_TIMEOUT_SECONDS: ${OUTBOUND_READ_TIMEOUT_SECONDS:-60}
  MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-3}
  # The checkpoint quota — what may become a committed revision, never a
  # physical disk ceiling. The workspace drill lowers it to cross it quickly.
  WORKSPACE_MAX_BYTES: ${WORKSPACE_MAX_BYTES:-2147483648}
  # The sandbox. The image allowlist is empty by default, which is how a
  # deployment that has not chosen an image fails: no tool can run at all.
  SANDBOX_IMAGE_DIGEST: ${SANDBOX_IMAGE_DIGEST:-}
  # Where the worker and the scheduler find the controller, and where it
  # listens: the same socket, in the volume the three of them share.
  SANDBOX_CONTROLLER_URL: unix:///run/tiny-hermes/controller.sock
  SANDBOX_CONTROLLER_LISTEN: unix:///run/tiny-hermes/controller.sock
  # The outbound boundary (§16.5). Empty by default in every field, which is
  # what makes an unconfigured deployment send nothing rather than everything:
  # no proxy URL means every outbound call refuses instead of connecting
  # directly, and no allowed hosts means the platform layer approves nothing.
  EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-}
  EGRESS_PROXY_TOKEN: ${EGRESS_PROXY_TOKEN:-}
  EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
  EGRESS_ALLOWED_PORTS: ${EGRESS_ALLOWED_PORTS:-}
  # The network a sandbox is attached to. Empty leaves a sandbox with no
  # network at all, which is §16.4's default and what a deployment running no
  # proxy gets.
  # Where the console can be reached from outside, for links the platform
  # puts inside messages it sends (§19.2's status card). Empty renders no
  # button rather than a guessed URL, which would be a dead link.
  CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-}
  # One network per sandbox (product design §1.21.4, v2.21): the controller
  # makes an `internal` bridge for each, on a /28 from this pool, and puts the
  # proxy on it. Empty leaves a sandbox with no network at all, §16.4's
  # default. The pool must not overlap the host's networks or Compose's own.
  SANDBOX_NETWORK_POOL: ${SANDBOX_NETWORK_POOL:-}
  SANDBOX_EGRESS_PROXY_CONTAINER: ${SANDBOX_EGRESS_PROXY_CONTAINER:-tiny-hermes-egress-proxy-1}
  # Retired by v2.21, and passed through only so the controller can say so: a
  # `.env` that still sets it and not the pool above would otherwise lose its
  # sandboxes' network with nothing in the log to say why.
  SANDBOX_EGRESS_NETWORK: ${SANDBOX_EGRESS_NETWORK:-}
  SANDBOX_IDLE_TTL_SECONDS: ${SANDBOX_IDLE_TTL_SECONDS:-300}
  # How often the controller removes containers and data volumes a crash left
  # on its host with nothing in the database owning them.
  SANDBOX_SWEEP_SECONDS: ${SANDBOX_SWEEP_SECONDS:-300}
  # Sandbox memory admission (§21.3): each sandbox's limit, and the sum of
  # limits the controller admits. An empty budget is half the host's memory.
  SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-1024}
  SANDBOX_MEMORY_BUDGET_MB: ${SANDBOX_MEMORY_BUDGET_MB:-}
  # Present-but-empty for the controller: Settings requires the fields so a
  # credentialless API deployment fails at startup, and empty is exactly what
  # the controller is entitled to.
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

x-app-env: &app-env
  <<: *base-env
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tiny-hermes-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-tiny-hermes-local-password}
  # Envelope KEK. 32 zero bytes, standard base64 — local compose only.
  # Generate a real one: python -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
  TINY_HERMES_KEK: ${TINY_HERMES_KEK:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  TINY_HERMES_KEK_ID: ${TINY_HERMES_KEK_ID:-v1}
  TINY_HERMES_PREVIOUS_KEK: ${TINY_HERMES_PREVIOUS_KEK:-}
  TINY_HERMES_PREVIOUS_KEK_ID: ${TINY_HERMES_PREVIOUS_KEK_ID:-}
  # Model endpoint credentials. `credential_ref` may name this variable *or*
  # a Secret id created from the console. Compose keeps the env form so an
  # endpoint registered before 4C still resolves. Create a platform Secret
  # and point an endpoint at its id to exercise rewrap.
  TINY_HERMES_MODEL_KEY_EXAMPLE: ${TINY_HERMES_MODEL_KEY_EXAMPLE:-}

# Every long-running service has `restart: unless-stopped`. When the Docker
# daemon itself restarts — on 2026-09-30 the OOM killer took it — every
# container stops with it, and without a policy nothing brings them back.
# `unless-stopped` rather than `always`: a service an operator stopped stays
# stopped. A daemon restart starts them all at once and ignores `depends_on`.
# `migrate` is a one-shot job and has no policy: restarting it would loop the
# migrations, and the schema it produced outlives the daemon anyway.
services:
  postgres:
    restart: unless-stopped
    image: postgres:17.6-alpine
    # Must cover the sum of every process's pool at its largest, not the
    # connections seen on a quiet day: see the ops manual's §8.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: tiny_hermes
      POSTGRES_USER: tiny_hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiny_hermes -d tiny_hermes"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Loopback by default: Redis has no password, and the defaults above are
    # in this file for anyone to read. Tier B sets DATASTORE_BIND_ADDRESS to
    # the private address its Worker hosts reach (ops manual §7.2).
    ports: ["${DATASTORE_BIND_ADDRESS:-127.0.0.1}:5432:5432"]

  redis:
    restart: unless-stopped
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["${DATASTORE_BIND_ADDRESS:-127.0.0.1}:6379:6379"]

  # S3-compatible object store. MinIO until 2026-09-11, when its images left
  # Docker Hub; a deployment that ran MinIO copies its objects over with
  # `scripts/migrate_object_store.py` (docs/operations.md). The S3 port stays
  # 9000 so nothing that talks to it changes.
  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-s3.port=9000"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-tiny-hermes-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-tiny-hermes-local-password}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["${DATASTORE_BIND_ADDRESS:-127.0.0.1}:9000:9000"]

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["8000:8000"]

  # The Worker and the Scheduler run the console script directly rather than
  # through `uv run`, so PID 1 is the process itself: SIGTERM reaches the loop
  # that knows how to finish its slice, and the liveness probe has a real
  # process to look at instead of a wrapper. Neither publishes a port, because
  # neither accepts a request; work arrives through PostgreSQL and Redis.
  # The only service that mounts the Docker socket. Product design §16:
  # Docker 控制权只授予可信的 sandbox-controller。API、Web、Agent 沙箱和模型
  # 均不得直接访问 Docker socket. The Worker and the Scheduler get the
  # controller's own socket and nothing else, so a Worker that wanted to create
  # a privileged container has nothing to ask. That is a property of this file
  # rather than of anybody's discipline, which is the point.
  controller:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/tiny-hermes-controller"]
    # The base only: no object-store credential and no model key may reach the one
    # process that holds the Docker socket (design §14.6).
    environment: *base-env
    # Root inside its own container, because the socket is root:root 0660 and
    # no group id is portable between Docker Desktop and a Linux host.
    #
    # This is worth being straight about rather than dressing up: **mounting
    # the Docker socket is already root-equivalent on the host.** A process
    # holding it can start a privileged container with the host filesystem
    # mounted, whatever uid it runs as itself. So a non-root uid here would be
    # decoration, and pretending otherwise would be worse than not having it.
    #
    # What actually contains this is the rest of the arrangement: exactly one
    # service has the socket, it accepts six actions, it generates every
    # container parameter itself, and it is small enough to read. The
    # controller is the most privileged component in the platform and that is
    # why it does so little.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-socket:/run/tiny-hermes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck: &process-alive
      test: ["CMD-SHELL", "grep -q tiny-hermes /proc/1/cmdline"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/tiny-hermes-worker"]
    environment: *app-env
    # Compose's default is 10 s, shorter than the Worker's own grace period:
    # killed at 10 s, a restart interrupted three of four long tasks.
    stop_grace_period: 30s
    volumes:
      - controller-socket:/run/tiny-hermes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ordering, not hostage-taking. A deployment with no tools configured
      # never calls the controller, and a Worker held back by an unhealthy one
      # would leave every Run queued — which is what happened the first time
      # this said `service_healthy`. A tool-bound Run that meets an absent
      # controller waits and retries (M1 sandbox design §11), which holds up
      # that Run rather than all of them.
      controller:
        condition: service_started
    # Liveness, not progress: this reports that the process is still there. A
    # Worker wedged inside a slice still answers healthy, and the Scheduler's
    # lease expiry is what actually recovers its Run.
    healthcheck: *process-alive

  scheduler:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/tiny-hermes-scheduler"]
    environment: *app-env
    volumes:
      - controller-socket:/run/tiny-hermes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *process-alive

  # The outbound boundary, and the only process whose job is to say no to a
  # packet. §16.5 requires it to be separate: a boundary enforced inside the
  # process it bounds is not one. Like the controller it holds nothing else —
  # no Docker socket, no object-store credentials, no model keys — because a
  # process that decides where traffic may go must not also be worth attacking
  # for what it is carrying.
  egress-proxy:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/tiny-hermes-egress"]
    # The base, like the controller. It is the one process a sandbox can send
    # a packet to, and its request parser is our own code: whatever this
    # environment holds is what a flaw in that parser hands to a Run.
    environment: *base-env
    # On the default network here, to reach the internet and the database.
    # The controller joins it to each sandbox's own `internal` bridge as that
    # bridge is made (§1.21.4, v2.21), so the proxy is the one thing on it a
    # sandbox can send a packet to; nothing in this file puts sandboxes
    # together any more. Its container name is SANDBOX_EGRESS_PROXY_CONTAINER.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *process-alive

  web:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["3000:3000"]

  # Design §7's entry point: the end-user chat surface, deliberately its own
  # service and its own port rather than a second `location` block on `web`'s
  # nginx — the two apps carry two different identity systems (design §3),
  # and console.spec.ts's own walk must not become reachable through this
  # one's origin or vice versa.
  chat-web:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: apps/chat-web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["3001:3001"]

  # -- observability (design §5.4): `docker compose --profile observability up`.
  # None of it starts by default, and what it publishes is on loopback only:
  # Grafana ships with admin/admin and Jaeger with no login. The metrics port
  # itself (9464) is published by no service; Prometheus reaches it on the
  # Compose network.
  prometheus:
    profiles: ["observability"]
    restart: unless-stopped
    image: prom/prometheus:v3.5.0
    # Prometheus reads a bearer token from a file, never from the
    # environment, so the token is written to one at start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf %s "$$METRICS_TOKEN" > /tmp/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: ["observability"]
    restart: unless-stopped
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["127.0.0.1:3002:3000"]

  jaeger:
    profiles: ["observability"]
    restart: unless-stopped
    image: jaegertracing/jaeger:2.8.0
    # 4317/4318 receive OTLP from the platform on the Compose network; only
    # the UI is published.
    ports: ["127.0.0.1:16686:16686"]

  postgres-exporter:
    profiles: ["observability"]
    restart: unless-stopped
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://tiny_hermes:${POSTGRES_PASSWORD:-local-only}@postgres:5432/tiny_hermes?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    profiles: ["observability"]
    restart: unless-stopped
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379

volumes:
  prometheus-data:
  postgres-data:
  # Not `minio-data`: SeaweedFS cannot read MinIO's on-disk format. That volume
  # is deliberately no longer declared, so `docker compose down -v` does not
  # delete a deployment's old objects before they have been copied over.
  seaweedfs-data:
  # Shared by the controller, the worker and the scheduler. Not by the API or
  # the web service, which have no business talking to the controller at all.
  controller-socket:
