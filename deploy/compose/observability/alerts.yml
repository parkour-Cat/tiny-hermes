# Observability design §5.5. Rules only: where an alert goes is the
# deployment's Alertmanager to decide. Every threshold is a first value, to be
# set from a pilot and written into product design §24, like capacity plan §6.
groups:
  - name: tiny-hermes
    rules:
      - alert: ProcessMissing
        # 2026-10-24 drill: a stopped scheduler left no `up` series at all,
        # since Prometheus finds these by DNS name and the name stopped
        # resolving. Every alert reading its metrics went quiet with it,
        # QueueWaitingTooLong included. `absent` is what sees a target that
        # is not there, where `up == 0` sees one that is there and failing.
        expr: >-
          absent(up{job="tiny-hermes", service="api"})
          or absent(up{job="tiny-hermes", service="worker"})
          or absent(up{job="tiny-hermes", service="scheduler"})
          or absent(up{job="tiny-hermes", service="controller"})
          or absent(up{job="tiny-hermes", service="egress-proxy"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No {{ $labels.service }} process is running"
          description: >-
            Nothing serves its metrics, so no other alert about it can fire.
            Without a scheduler, interrupted Runs are not recovered and the
            queue's own metrics stop.

      - alert: ProcessDown
        expr: up{job="tiny-hermes"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} at {{ $labels.instance }} is not answering"

      - alert: QueueWaitingTooLong
        expr: max(tiny_hermes_queue_oldest_age_seconds) > 60
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A claimable Run has waited over a minute for five minutes
          description: Capacity is short. Check worker lanes and sandbox admission.

      - alert: WorkerLanesSaturated
        expr: >-
          sum(tiny_hermes_worker_lanes{state="busy"})
          / sum(tiny_hermes_worker_lanes{state="total"}) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Over 90% of worker lanes have been busy for ten minutes

      - alert: SchedulerScanStalled
        # 5x the default one-second scan interval, with room for slow scans.
        # Not the housekeeping scans, which run once a minute (2026-10-24) and
        # would go stale between runs under this deadline.
        expr: >-
          time() - max by (scan) (tiny_hermes_scheduler_scan_last_success_timestamp{scan!~"cancel_aged_compat_timeouts|collect_expired_records|collect_upload_garbage|expire_artifacts"})
          > 60
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Scheduler scan {{ $labels.scan }} has not succeeded for over a minute"
          description: >-
            One scan failing every cycle, or the scheduler stopped. Recovery,
            approval expiry and cleanup live in these scans.

      - alert: SchedulerHousekeepingStalled
        # Three missed minutes, not one late pass: these run once a minute.
        expr: >-
          time() - max by (scan) (tiny_hermes_scheduler_scan_last_success_timestamp{scan=~"cancel_aged_compat_timeouts|collect_expired_records|collect_upload_garbage|expire_artifacts"})
          > 240
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Scheduler housekeeping {{ $labels.scan }} has not succeeded for four minutes"
          description: >-
            Expired records, upload garbage and old artifacts are not being
            removed. Nothing a Run waits on lives here; disk and table sizes grow.

      - alert: SandboxAdmissionRefusing
        expr: increase(tiny_hermes_sandbox_admission_rejected_total[1m]) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: The sandbox memory budget has refused acquires for ten minutes

      - alert: EgressDenialsSpiking
        expr: >-
          sum(rate(tiny_hermes_egress_connections_total{decision="deny"}[5m]))
          > 5 * sum(rate(tiny_hermes_egress_connections_total{decision="deny"}[1h] offset 5m))
          and sum(rate(tiny_hermes_egress_connections_total{decision="deny"}[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Egress refusals are five times the last hour's rate
          description: An Agent misconfigured, or something probing. The proxy log names hosts.

      - alert: LoginFailuresSpiking
        expr: sum(increase(tiny_hermes_login_attempts_total{outcome="bad_credentials"}[1m])) > 30
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Over 30 failed logins a minute
