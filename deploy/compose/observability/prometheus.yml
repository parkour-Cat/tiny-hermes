# Observability design §5.4. Scraped on the Compose network; port 9464 is
# published by no service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tiny-hermes
    # Written from METRICS_TOKEN at start (compose.yaml). The egress proxy
    # serves nothing without it; the others accept it when they have one.
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    # Docker's DNS answers a service name with every replica's address, so
    # `--scale worker=M` is M targets with nothing to edit here.
    dns_sd_configs:
      - names: [api, worker, scheduler, controller, egress-proxy]
        type: A
        port: 9464
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
